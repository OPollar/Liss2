<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LISS — Entidade IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #08080f;
    --bg-2: #0d0d18;
    --panel: rgba(255,255,255,0.035);
    --panel-strong: rgba(255,255,255,0.05);
    --panel-border: rgba(180,140,255,0.16);
    --violet: #b467ff;
    --violet-deep: #7c3aed;
    --magenta: #ff4fa3;
    --cyan: #5eead4;
    --amber: #f59e0b;
    --ink: #ece8fb;
    --ink-dim: #8b8fa8;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
    --body: 'Manrope', sans-serif;
    --vh: 1dvh;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    height:calc(var(--vh, 1dvh) * 100);
    overflow:hidden;
    position:relative;
  }
 
  /* ambient nebula backdrop */
  .nebula{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(circle at 15% 10%, rgba(124,58,237,0.22), transparent 42%),
      radial-gradient(circle at 88% 18%, rgba(255,79,163,0.13), transparent 40%),
      radial-gradient(circle at 40% 95%, rgba(94,234,212,0.09), transparent 50%);
    animation: drift 24s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{ transform: scale(1) translate(0,0); }
    100%{ transform: scale(1.15) translate(-2%, 2%); }
  }
  .grain{
    position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0.035; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
 
  /* ---------- Layout raiz: grid que ocupa a tela inteira ---------- */
  .app{
    position:relative; z-index:2;
    height:100%;
    display:grid;
    grid-template-columns: 380px 1fr;
    grid-template-rows: 100%;
  }
 
  /* ---------- Coluna do console (orb + controles) ---------- */
  .console{
    height:100%;
    display:flex; flex-direction:column;
    padding: 22px 22px 20px;
    border-right:1px solid var(--panel-border);
    background: linear-gradient(180deg, rgba(180,103,255,0.035), transparent 40%);
    min-height:0;
  }
 
  header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    flex-shrink:0;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  h1{
    font-family:var(--display); font-weight:700; font-size:1.5rem; letter-spacing:3px;
    background: linear-gradient(120deg, var(--violet), var(--magenta));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .status-wrap{ display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
  #status{
    font-family:var(--mono); font-size:0.68rem; color:var(--cyan);
    display:flex; align-items:center; gap:6px; letter-spacing:0.4px; white-space:nowrap;
  }
  #status .dot{ width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); animation:blink 2s infinite; flex-shrink:0; }
  @keyframes blink{ 50%{ opacity:0.4; } }
  #model-tag{
    font-family:var(--mono); font-size:0.64rem; color:var(--ink-dim);
    border:1px solid var(--panel-border); border-radius:20px; padding:3px 10px;
  }
 
  /* orb ocupa o espaço flexível central, sempre proporcional */
  .stage-wrap{
    flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
    position:relative; padding: 12px 0;
  }
  .stage{
    position:relative; width:min(46vh, 240px); aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  svg#sigil{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  #ring-outer{ transform-origin:50% 50%; animation:spin 18s linear infinite; }
  #ring-ticks{ transform-origin:50% 50%; animation:spin-rev 34s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes spin-rev{ to{ transform:rotate(-360deg); } }
  #core{ transition: transform 0.08s ease-out, filter 0.15s ease; transform-origin:50% 50%; }
  .stage.idle #core{ animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.045); } }
  .stage.thinking #ring-outer{ animation-duration:2.2s; }
  .stage.thinking #core{ filter:drop-shadow(0 0 18px var(--cyan)); }
  .stage.speaking #core{ filter:drop-shadow(0 0 26px var(--magenta)); }
 
  #avatar-photo{
    position:absolute; width:78%; height:78%; border-radius:50%; object-fit:cover;
    left:50%; top:50%; transform:translate(-50%,-50%); display:none;
    border:1px solid rgba(255,255,255,0.15);
  }
  #avatar-upload{ display:none; }
  .avatar-hint{
    position:absolute; bottom:-24px; left:50%; transform:translateX(-50%);
    font-family:var(--mono); font-size:0.62rem; color:var(--ink-dim); letter-spacing:0.5px;
    white-space:nowrap; opacity:0; transition:opacity 0.2s ease; pointer-events:none;
  }
  .stage:hover + .avatar-hint, .stage-wrap:hover .avatar-hint{ opacity:0.8; }
 
  #screen-thumb{
    position:fixed; top:16px; right:16px; z-index:6; width:110px; border-radius:10px;
    border:1px solid var(--violet); box-shadow:0 0 20px rgba(180,103,255,0.35); display:none;
  }
 
  /* ---------- Dock de controles (dentro do console) ---------- */
  .dock{
    flex-shrink:0; display:flex; flex-direction:column; gap:10px; margin-top:8px;
  }
  .row{ display:flex; gap:8px; }
  input[type="text"]{
    flex:1; padding:13px 16px; border-radius:12px; border:1px solid var(--panel-border);
    background:rgba(255,255,255,0.04); color:var(--ink); font-family:var(--body); font-size:0.94rem; outline:none;
    min-width:0;
  }
  input[type="text"]:focus{ border-color:var(--violet); box-shadow:0 0 0 3px rgba(180,103,255,0.15); }
  button{
    padding:12px 16px; border:none; border-radius:12px; font-weight:600; font-size:0.85rem;
    cursor:pointer; transition:transform 0.12s ease, filter 0.15s ease, box-shadow 0.15s ease; font-family:var(--body);
  }
  button:hover{ filter:brightness(1.12); }
  button:active{ transform:scale(0.96); }
  button:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  #btn-send{ background:linear-gradient(120deg,var(--violet),var(--violet-deep)); color:#0b0b10; flex-shrink:0; }
  #btn-speak{ background:rgba(180,103,255,0.14); color:var(--ink); border:1px solid var(--panel-border); flex:1; }
  #btn-speak.recording{ background:#dc2626; color:white; animation:pulse 1s infinite; }
  #btn-screen{ background:rgba(94,234,212,0.10); color:var(--cyan); border:1px solid rgba(94,234,212,0.25); flex:1; }
  #btn-screen.active{ background:var(--cyan); color:#06231f; }
  #btn-deep{ background:rgba(255,79,163,0.08); color:var(--magenta); border:1px solid rgba(255,79,163,0.25); flex:1; }
  #btn-deep.active{ background:var(--magenta); color:#22030f; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(220,38,38,0.6); } 70%{ box-shadow:0 0 0 10px rgba(220,38,38,0); } 100%{ box-shadow:0 0 0 0 rgba(220,38,38,0); } }
 
  /* ---------- Coluna do chat (usa o resto da tela) ---------- */
  .chat-col{
    height:100%; min-height:0; display:flex; flex-direction:column;
    padding: 22px 26px;
  }
  .chat-col .eyebrow{
    font-family:var(--mono); font-size:0.68rem; color:var(--ink-dim); letter-spacing:1.5px;
    text-transform:uppercase; margin-bottom:10px; flex-shrink:0;
  }
  #chat-log{
    flex:1; min-height:0;
    background:var(--panel); backdrop-filter:blur(18px);
    border:1px solid var(--panel-border); border-radius:20px;
    padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:12px;
  }
  .msg{ padding:12px 16px; border-radius:14px; max-width:78%; font-size:0.95rem; line-height:1.55; animation:rise 0.25s ease; }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  .msg.user{ background:rgba(124,58,237,0.28); color:#ece8ff; align-self:flex-end; border:1px solid rgba(180,103,255,0.25); }
  .msg.liss{ background:rgba(255,79,163,0.08); color:#f5e9ff; align-self:flex-start; border:1px solid rgba(255,79,163,0.22); }
  .msg.system{ background:transparent; color:var(--amber); align-self:center; font-family:var(--mono); font-size:0.72rem; max-width:100%; }
  .msg b{ font-family:var(--mono); font-weight:500; font-size:0.7rem; opacity:0.65; display:block; margin-bottom:4px; letter-spacing:0.5px; }
  audio{ margin-top:6px; height:30px; width:100%; max-width:240px; }
 
  /* indicador de "pensando" dentro do chat */
  .typing{ display:flex; gap:4px; align-self:flex-start; padding:14px 16px; }
  .typing span{ width:6px; height:6px; border-radius:50%; background:var(--magenta); opacity:0.5; animation:typing-bounce 1.1s infinite ease-in-out; }
  .typing span:nth-child(2){ animation-delay:0.15s; }
  .typing span:nth-child(3){ animation-delay:0.3s; }
  @keyframes typing-bounce{ 0%,60%,100%{ transform:translateY(0); opacity:0.4; } 30%{ transform:translateY(-5px); opacity:1; } }
 
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--panel-border); border-radius:10px; }
 
  /* ---------- Mobile: empilha em vez de dividir em colunas ---------- */
  @media (max-width: 860px){
    .app{
      grid-template-columns: 1fr;
      grid-template-rows: auto auto 1fr;
    }
    .console{
      border-right:none; border-bottom:1px solid var(--panel-border);
      padding: 16px 16px 14px;
      flex-direction:row; flex-wrap:wrap; align-items:center; gap:10px;
    }
    header{ width:100%; }
    .stage-wrap{ display:none; } /* orb some no mobile pra dar espaço ao chat/controles */
    .dock{ width:100%; margin-top:0; }
    .chat-col{ padding:14px 14px 12px; min-height:0; }
    .msg{ max-width:90%; }
    #screen-thumb{ width:76px; top:10px; right:10px; }
  }
 
  @media (min-width: 861px) and (max-width: 1180px){
    .app{ grid-template-columns: 320px 1fr; }
    .stage{ width:min(38vh, 190px); }
  }
 
  @media (prefers-reduced-motion: reduce){
    .nebula, #ring-outer, #ring-ticks, .stage.idle #core, .msg, .typing span{ animation:none !important; }
  }
</style>
</head>
<body>
  <div class="nebula"></div>
  <div class="grain"></div>
 
  <div class="app">
    <!-- Console: identidade, orb reativo e controles -->
    <section class="console">
      <header>
        <div class="brand"><h1>LISS</h1></div>
        <div class="status-wrap">
          <div id="status"><span class="dot"></span>conectando…</div>
          <div id="model-tag">—</div>
        </div>
      </header>
 
      <div class="stage-wrap">
        <div class="stage idle" id="stage">
          <svg id="sigil" viewBox="0 0 220 220">
            <defs>
              <radialGradient id="coreGrad" cx="50%" cy="45%" r="60%">
                <stop offset="0%" stop-color="#e9d5ff"/>
                <stop offset="45%" stop-color="#b467ff"/>
                <stop offset="100%" stop-color="#3b0764"/>
              </radialGradient>
            </defs>
            <g id="ring-ticks" stroke="rgba(180,103,255,0.35)" stroke-width="2">
              <line x1="110" y1="6" x2="110" y2="18"/>
              <line x1="110" y1="202" x2="110" y2="214"/>
              <line x1="6" y1="110" x2="18" y2="110"/>
              <line x1="202" y1="110" x2="214" y2="110"/>
              <line x1="34" y1="34" x2="43" y2="43"/>
              <line x1="177" y1="34" x2="168" y2="43"/>
              <line x1="34" y1="186" x2="43" y2="177"/>
              <line x1="177" y1="186" x2="168" y2="177"/>
            </g>
            <circle id="ring-outer" cx="110" cy="110" r="96" fill="none" stroke="url(#coreGrad)" stroke-width="1.4" stroke-dasharray="6 10" opacity="0.55"/>
            <circle cx="110" cy="110" r="78" fill="none" stroke="rgba(255,79,163,0.18)" stroke-width="1"/>
            <circle id="core" cx="110" cy="110" r="58" fill="url(#coreGrad)"/>
          </svg>
          <img id="avatar-photo" alt="retrato">
          <input type="file" id="avatar-upload" accept="image/*">
        </div>
        <div class="avatar-hint">clique pra trocar o retrato</div>
      </div>
 
      <div class="dock">
        <div class="row">
          <input type="text" id="text-input" placeholder="Digite sua mensagem para a Liss…" />
          <button id="btn-send">Enviar</button>
        </div>
        <div class="row">
          <button id="btn-speak">🎤 Falar</button>
          <button id="btn-screen">🖥️ Ver Tela</button>
          <button id="btn-deep">🧠 Profundo</button>
        </div>
      </div>
    </section>
 
    <!-- Chat: ocupa o resto da tela inteira -->
    <section class="chat-col">
      <div class="eyebrow">conversa</div>
      <div id="chat-log">
        <div class="msg liss"><b>LISS</b>Olá, Gatão. Diga logo o que você quer antes que eu mude de ideia.</div>
      </div>
    </section>
  </div>
 
  <img id="screen-thumb">
 
<script>
// altura real de viewport em mobile (evita barra de endereço cortando layout)
function setVH(){ document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
setVH();
window.addEventListener('resize', setVH);
window.addEventListener('orientationchange', setVH);
 
const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
let ws;
let reconnectDelay = 1500;
const stage = document.getElementById("stage");
const statusEl = document.getElementById("status");
const modelTag = document.getElementById("model-tag");
const chatLog = document.getElementById("chat-log");
const textInput = document.getElementById("text-input");
const btnSend = document.getElementById("btn-send");
const btnSpeak = document.getElementById("btn-speak");
const btnScreen = document.getElementById("btn-screen");
const btnDeep = document.getElementById("btn-deep");
const screenThumb = document.getElementById("screen-thumb");
const avatarPhoto = document.getElementById("avatar-photo");
const avatarUpload = document.getElementById("avatar-upload");
 
let modoProfundo = false;
let compartilhandoTela = false;
let screenStream, screenVideo, screenCanvas, screenInterval;
let ultimoFrame = null;
let mediaRecorder, audioChunks = [], isRecording = false;
let audioCtx, analyser, rafId;
let typingEl = null;
 
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    statusEl.innerHTML = '<span class="dot"></span>conectada à nuvem';
    reconnectDelay = 1500;
  };
  ws.onclose = () => {
    statusEl.innerHTML = '<span class="dot" style="background:#f87171"></span>desconectada — reconectando…';
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.5, 15000); // backoff progressivo
  };
  ws.onerror = () => {};
  ws.onmessage = handleMessage;
}
connect();
 
function setStageState(state){
  stage.classList.remove("idle","thinking","speaking");
  stage.classList.add(state);
}
 
function addMsg(cls, label, text){
  const div = document.createElement("div");
  div.className = "msg " + cls;
  if(label) div.innerHTML = `<b>${label}</b>${text}`;
  else div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  return div;
}
 
function showTyping(){
  hideTyping();
  typingEl = document.createElement("div");
  typingEl.className = "typing";
  typingEl.innerHTML = "<span></span><span></span><span></span>";
  chatLog.appendChild(typingEl);
  chatLog.scrollTop = chatLog.scrollHeight;
}
function hideTyping(){
  if(typingEl){ typingEl.remove(); typingEl = null; }
}
 
async function handleMessage(event){
  const data = JSON.parse(event.data);
  hideTyping();
 
  if(data.type === "info"){
    addMsg("system", null, data.message);
    setStageState("idle");
    return;
  }
 
  if(data.type === "response"){
    if(data.user_text) addMsg("user", "VOCÊ", data.user_text);
    addMsg("liss", "LISS", data.text);
    if(data.model) modelTag.textContent = data.model;
 
    if(data.audio){
      playWithReactiveOrb(data.audio);
    } else {
      setStageState("idle");
    }
  }
}
 
function playWithReactiveOrb(base64Audio){
  const audio = new Audio("data:audio/mp3;base64," + base64Audio);
  setStageState("speaking");
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    const data = new Uint8Array(analyser.frequencyBinCount);
    const core = document.getElementById("core");
    function tick(){
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a,b)=>a+b,0) / data.length;
      const scale = 1 + Math.min(avg/255, 1) * 0.28;
      core.style.transform = `scale(${scale})`;
      rafId = requestAnimationFrame(tick);
    }
    tick();
  }catch(e){ /* fallback silencioso sem análise de amplitude */ }
 
  audio.play();
  audio.onended = () => {
    cancelAnimationFrame(rafId);
    document.getElementById("core").style.transform = "scale(1)";
    setStageState("idle");
  };
}
 
function sendPayload(payload){
  if(!ws || ws.readyState !== 1){ addMsg("system", null, "Ainda conectando à Liss…"); return; }
  setStageState("thinking");
  showTyping();
  ws.send(JSON.stringify(payload));
}
 
function sendText(){
  const text = textInput.value.trim();
  if(!text && !ultimoFrame) return;
  if(text) addMsg("user", "VOCÊ", text);
  sendPayload({ text, frame: ultimoFrame });
  textInput.value = "";
}
btnSend.onclick = sendText;
textInput.addEventListener("keypress", (e) => { if(e.key === "Enter") sendText(); });
 
btnDeep.onclick = () => {
  modoProfundo = !modoProfundo;
  btnDeep.classList.toggle("active", modoProfundo);
  if(ws && ws.readyState === 1) ws.send(JSON.stringify({ toggle_deep: modoProfundo }));
};
 
// --- Ver tela ---
btnScreen.onclick = async () => {
  if(!compartilhandoTela){
    try{
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      screenVideo = document.createElement("video");
      screenVideo.srcObject = screenStream;
      await screenVideo.play();
      screenCanvas = document.createElement("canvas");
      compartilhandoTela = true;
      btnScreen.classList.add("active");
      btnScreen.textContent = "🖥️ Parar";
      screenThumb.style.display = "block";
 
      screenInterval = setInterval(() => {
        screenCanvas.width = screenVideo.videoWidth * 0.5;
        screenCanvas.height = screenVideo.videoHeight * 0.5;
        const ctx = screenCanvas.getContext("2d");
        ctx.drawImage(screenVideo, 0, 0, screenCanvas.width, screenCanvas.height);
        ultimoFrame = screenCanvas.toDataURL("image/jpeg", 0.6).split(",")[1];
        screenThumb.src = screenCanvas.toDataURL("image/jpeg", 0.6);
      }, 4000);
 
      screenStream.getVideoTracks()[0].onended = pararTela;
    }catch(err){ addMsg("system", null, "Compartilhamento de tela recusado ou indisponível."); }
  } else {
    pararTela();
  }
};
 
function pararTela(){
  compartilhandoTela = false;
  ultimoFrame = null;
  btnScreen.classList.remove("active");
  btnScreen.textContent = "🖥️ Ver Tela";
  screenThumb.style.display = "none";
  if(screenInterval) clearInterval(screenInterval);
  if(screenStream) screenStream.getTracks().forEach(t => t.stop());
}
 
// --- Gravar voz ---
btnSpeak.onclick = async () => {
  if(!isRecording){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
        const audioUrl = URL.createObjectURL(audioBlob);
        addMsg("user", "SEU ÁUDIO", `<audio controls src="${audioUrl}"></audio>`);
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = () => {
          const base64Audio = reader.result.split(',')[1];
          sendPayload({ audio: base64Audio, frame: ultimoFrame });
        };
      };
      mediaRecorder.start();
      isRecording = true;
      btnSpeak.classList.add("recording");
      btnSpeak.textContent = "🛑 Parar";
    }catch(err){ addMsg("system", null, "Acesso ao microfone negado ou indisponível."); }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    btnSpeak.classList.remove("recording");
    btnSpeak.textContent = "🎤 Falar";
  }
};
 
// --- Editar retrato (avatar) ---
stage.addEventListener("click", () => {
  if(compartilhandoTela) return;
  avatarUpload.click();
});
avatarUpload.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    avatarPhoto.src = ev.target.result;
    avatarPhoto.style.display = "block";
    try{ localStorage.setItem("liss_avatar", ev.target.result); }catch(err){ /* storage cheio/bloqueado — ignora */ }
  };
  reader.readAsDataURL(file);
});
(function loadAvatar(){
  try{
    const saved = localStorage.getItem("liss_avatar");
    if(saved){ avatarPhoto.src = saved; avatarPhoto.style.display = "block"; }
  }catch(err){ /* localStorage indisponível */ }
})();
</script>
</body>
</html>
