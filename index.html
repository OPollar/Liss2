<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shogun AI - Interface</title>
    <style>
        body {
            background-color: #0f0f15;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        
        h1 {
            color: #a855f7;
            margin-bottom: 5px;
        }
        /* Container da VTuber */
        
        #vtuber-container {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 4px solid #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a24;
            position: relative;
            overflow: hidden;
        }
        /* Avatar VTuber Simples em CSS (Expande para Live2D) */
        
        .avatar {
            font-size: 80px;
            transition: transform 0.2s;
        }
        
        .speaking {
            animation: pulse 0.5s infinite alternate;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.15);
            }
        }
        /* Status e Chat Log */
        
        #status {
            font-size: 14px;
            color: #22c55e;
            margin-bottom: 10px;
        }
        
        #chat-log {
            width: 100%;
            max-width: 500px;
            height: 150px;
            background: #181824;
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            font-size: 14px;
            border: 1px solid #2e2e42;
        }
        /* Painel de Controles */
        
        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
            justify-content: center;
        }
        
        button {
            background: #a855f7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        
        button:hover {
            background: #9333ea;
        }
        /* Botão Modo +18 */
        
        .btn-18 {
            background: #3f3f5a;
            border: 1px solid #ef4444;
            color: #ef4444;
        }
        
        .btn-18.active {
            background: #ef4444;
            color: white;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
        }
    </style>
</head>

<body>

    <div>
        <h1>👑 SHOGUN AI</h1>
        <div id="status">● Conectado à Nuvem</div>
    </div>

    <!-- Área da Bonequinha VTuber -->
    <div id="vtuber-container">
        <div id="avatar" class="avatar">🎭</div>
    </div>

    <!-- Log de Conversa -->
    <div id="chat-log">
        <p><i>Shogun aguardando seu comando...</i></p>
    </div>

    <!-- Controles do App -->
    <div class="controls">
        <button id="btn-speak">🎤 Falar</button>
        <button id="btn-screen">🖥️ Ver Tela</button>
        <button id="btn-18" class="btn-18">🔥 Modo +18: OFF</button>
    </div>

    <script>
        // Conexão WebSocket com o seu servidor no Render
        const ws = new WebSocket("wss://liss2.onrender.com/ws");

        const avatar = document.getElementById("avatar");
        const chatLog = document.getElementById("chat-log");
        const btn18 = document.getElementById("btn-18");
        let modo18 = false;

        ws.onopen = () => {
            console.log("Conectado ao backend!");
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === "response") {
                // Adiciona a resposta no log
                chatLog.innerHTML += `<p><strong>👑 Shogun:</strong> ${data.text}</p>`;
                chatLog.scrollTop = chatLog.scrollHeight;

                // Animação da VTuber falando
                avatar.classList.add("speaking");
                setTimeout(() => avatar.classList.remove("speaking"), 4000);
            }

            if (data.type === "info") {
                chatLog.innerHTML += `<p style="color: #ef4444;"><i>${data.message}</i></p>`;
            }
        };

        // Alternar Modo +18
        btn18.onclick = () => {
            modo18 = !modo18;
            btn18.classList.toggle("active");
            btn18.innerText = modo18 ? "🔥 Modo +18: ON" : "🔥 Modo +18: OFF";

            // Envia o comando pro servidor mudar a chave de contexto
            ws.send(JSON.stringify({
                "toggle_18": modo18
            }));
        };

        // Simulação de Envio de Texto/Voz (Ajustaremos para gravação de áudio real no próximo passo)
        document.getElementById("btn-speak").onclick = () => {
            const msg = prompt("O que deseja falar para a Shogun?");
            if (msg) {
                chatLog.innerHTML += `<p><strong>💬 Você:</strong> ${msg}</p>`;
                ws.send(JSON.stringify({
                    "text": msg
                }));
            }
        };
    </script>
</body>

</html>
