<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liss AI - VTuber</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0b10;
            color: #e2e8f0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
        }

        header { text-align: center; margin-top: 5px; }

        h1 {
            color: #c084fc;
            font-size: 2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
        }

        #status { font-size: 0.85rem; color: #22c55e; margin-top: 5px; font-weight: 600; }

        .vtuber-box {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 3px solid #c084fc;
            box-shadow: 0 0 30px rgba(192, 132, 252, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #1e1b4b 0%, #0f172a 100%);
            margin: 15px 0;
        }

        .avatar { font-size: 80px; user-select: none; transition: transform 0.15s ease; }
        .speaking { animation: talk 0.3s infinite alternate ease-in-out; }

        @keyframes talk {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.12) translateY(-5px); }
        }

        #chat-log {
            width: 100%;
            max-width: 600px;
            height: 220px;
            background: #13131d;
            border: 1px solid #27273a;
            border-radius: 16px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 0.95rem; line-height: 1.4; }
        .msg.user { background: #312e81; color: #e0e7ff; align-self: flex-end; }
        .msg.liss { background: #2e1065; color: #f3e8ff; align-self: flex-start; border: 1px solid #581c87; }
        .msg.system { background: transparent; color: #ef4444; align-self: center; font-style: italic; font-size: 0.8rem; }

        audio { margin-top: 5px; height: 30px; width: 100%; max-width: 200px; }

        .input-box {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 600px;
            margin-top: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #181824;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 600px;
            margin-top: 10px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #btn-send { background: #c084fc; color: #0b0b10; }
        #btn-speak { background: #a855f7; color: white; flex: 1; }
        #btn-speak.recording { background: #dc2626; animation: pulse 1s infinite; }
        #btn-screen { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
        #btn-18 { background: #181824; color: #ef4444; border: 1px solid #7f1d1d; }
        #btn-18.active { background: #ef4444; color: white; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>👑 LISS AI</h1>
        <div id="status">● Conectada à Nuvem</div>
    </header>

    <div class="vtuber-box">
        <div id="avatar" class="avatar">🎭</div>
    </div>

    <div id="chat-log">
        <div class="msg liss">Olá, Gatão. Sou a Liss. Diga logo o que você quer antes que eu mude de ideia.</div>
    </div>

    <div class="input-box">
        <input type="text" id="text-input" placeholder="Digite sua mensagem para a Liss..." />
        <button id="btn-send">Enviar</button>
    </div>

    <div class="controls">
        <button id="btn-speak">🎤 Gravar Voz</button>
        <button id="btn-screen">🖥️ Ver Tela</button>
        <button id="btn-18">🔥 Modo +18: OFF</button>
    </div>

    <script>
        const ws = new WebSocket("wss://liss2.onrender.com/ws");
        const avatar = document.getElementById("avatar");
        const chatLog = document.getElementById("chat-log");
        const btn18 = document.getElementById("btn-18");
        const btnSpeak = document.getElementById("btn-speak");
        const textInput = document.getElementById("text-input");
        const btnSend = document.getElementById("btn-send");
        
        let modo18 = false;
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        ws.onmessage = async (event) => {
            const data = JSON.parse(event.data);

            if (data.type === "response") {
                // Atualiza o texto que o usuário falou
                if (data.user_text) {
                    const userDiv = document.createElement("div");
                    userDiv.className = "msg user";
                    userDiv.innerHTML = `<strong>Você:</strong> ${data.user_text}`;
                    chatLog.appendChild(userDiv);
                }

                // Resposta da Liss
                const msgDiv = document.createElement("div");
                msgDiv.className = "msg liss";
                msgDiv.innerHTML = `<strong>Liss:</strong> ${data.text}`;
                chatLog.appendChild(msgDiv);
                chatLog.scrollTop = chatLog.scrollHeight;

                avatar.classList.add("speaking");

                // Áudio da Liss
                if (data.audio) {
                    const audio = new Audio("data:audio/mp3;base64," + data.audio);
                    audio.play();
                    audio.onended = () => avatar.classList.remove("speaking");
                } else {
                    setTimeout(() => avatar.classList.remove("speaking"), 3000);
                }
            }

            if (data.type === "info") {
                const sysDiv = document.createElement("div");
                sysDiv.className = "msg system";
                sysDiv.innerText = data.message;
                chatLog.appendChild(sysDiv);
                chatLog.scrollTop = chatLog.scrollHeight;
            }
        };

        function sendText() {
            const text = textInput.value.trim();
            if (text) {
                const userDiv = document.createElement("div");
                userDiv.className = "msg user";
                userDiv.innerHTML = `<strong>Você:</strong> ${text}`;
                chatLog.appendChild(userDiv);
                chatLog.scrollTop = chatLog.scrollHeight;

                ws.send(JSON.stringify({ "text": text }));
                textInput.value = "";
            }
        }

        btnSend.onclick = sendText;
        textInput.onkeypress = (e) => { if (e.key === "Enter") sendText(); };

        btn18.onclick = () => {
            modo18 = !modo18;
            btn18.classList.toggle("active");
            btn18.innerText = modo18 ? "🔥 Modo +18: ON" : "🔥 Modo +18: OFF";
            ws.send(JSON.stringify({ "toggle_18": modo18 }));
        };

        // Gravação com Player para ouvir o próprio áudio
        btnSpeak.onclick = async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        const audioUrl = URL.createObjectURL(audioBlob);

                        // Cria o player de áudio do usuário no chat
                        const userDiv = document.createElement("div");
                        userDiv.className = "msg user";
                        userDiv.innerHTML = `<strong>Seu Áudio:</strong><br><audio controls src="${audioUrl}"></audio>`;
                        chatLog.appendChild(userDiv);
                        chatLog.scrollTop = chatLog.scrollHeight;

                        // Envia para a Liss
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64Audio = reader.result.split(',')[1];
                            ws.send(JSON.stringify({ "audio": base64Audio }));
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btnSpeak.classList.add("recording");
                    btnSpeak.innerText = "🛑 Parar e Enviar";
                } catch (err) {
                    alert("Acesso ao microfone negado ou indisponível!");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btnSpeak.classList.remove("recording");
                btnSpeak.innerText = "🎤 Gravar Voz";
            }
        };
    </script>
</body>
</html>
